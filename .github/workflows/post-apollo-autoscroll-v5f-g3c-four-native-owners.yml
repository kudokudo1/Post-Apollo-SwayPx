name: SwayPX / V5F-G3C Four Real Owner Epochs, Virtual DENIED (HARD OFF)

on:
  pull_request:
    paths:
      - 'tests/autoscroll/ci_v5f_g3c_native_probe.c'
      - 'tests/autoscroll/ci_v5f_g3c_native_overlay.py'
      - 'tests/autoscroll/ci_v5f_g3c_protocol_client.c'
      - 'tests/autoscroll/ci_v5f_g3c_native_trace.py'
      - 'tests/autoscroll/ci_v5f_g3c_udmabuf.sh'
      - 'tests/autoscroll/test_v5f_g3c_native_four_owner.py'
      - 'MODEL/autoscroll-v5f-g3c-four-native-owners.md'
      - '.github/workflows/post-apollo-autoscroll-v5f-g3c-four-native-owners.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-real-owner-negative-native-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PA_AUTOSCROLL_CI_NATIVE_TRACE: "1"
      PA_G3C_NATIVE_FOUR_OWNER: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact child no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce eight-file only scope and hard-off native source
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import subprocess
          from pathlib import Path
          parent=subprocess.check_output(
              ["git","merge-base","HEAD",
               "origin/autoscroll/v5f-g3b-native-target-output-revocation-20261122"],
              text=True).strip()
          changed=set(subprocess.check_output(
              ["git","diff","--name-only",parent,"HEAD"],
              text=True).splitlines())
          allowed={
              "tests/autoscroll/ci_v5f_g3c_native_probe.c",
              "tests/autoscroll/ci_v5f_g3c_native_overlay.py",
              "tests/autoscroll/ci_v5f_g3c_protocol_client.c",
              "tests/autoscroll/ci_v5f_g3c_native_trace.py",
              "tests/autoscroll/ci_v5f_g3c_udmabuf.sh",
              "tests/autoscroll/test_v5f_g3c_native_four_owner.py",
              "MODEL/autoscroll-v5f-g3c-four-native-owners.md",
              ".github/workflows/post-apollo-autoscroll-v5f-g3c-four-native-owners.yml",
          }
          assert changed==allowed,(sorted(changed-allowed), sorted(allowed-changed))
          runtime=Path("sway/input/post_apollo_autoscroll_runtime.c").read_text()
          bridge=Path("sway/input/post_apollo_autoscroll_guard_bridge.c").read_text()
          meson=Path("sway/meson.build").read_text()
          assert "#define PA_AUTOSCROLL_LIVE_ACTIVATION 0" in runtime
          assert "const bool physical_verified = false;" in runtime
          assert "const bool native_scroll_lock_active = true;" in runtime
          assert "pa_scroll_dispatch_enable(" not in runtime
          assert ".origin = PA_POINTER_ORIGIN_UNKNOWN" in bridge
          assert "PA_POINTER_ORIGIN_PHYSICAL_LIBINPUT" not in bridge
          assert "ci_v5f_g3c_native_probe.c" not in meson
          assert "post_apollo_autoscroll_continuity.c" not in meson
          print("PA_G3C_EXACT_EIGHT_FILE_ZERO_PRODUCTION_OR_COMPANY_EDIT_PASS")
          PY
          python3 -B -m unittest discover -s tests/autoscroll \
            -p 'test_v5f_g3c_native_four_owner.py' -v
          python3 -B -m unittest discover -s tests/autoscroll \
            -p 'test_v5f_g3b_native_revocation.py' -v
          python3 -B -m unittest discover -s tests/autoscroll \
            -p 'test_v5f_g3a_continuity.py' -v
          test -z "$(git status --porcelain)"
      - name: Install pinned Nix in disposable GitHub runner
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Overlay C1 C2 owner hooks and G3C only in temp checkout
        run: |
          set -euo pipefail
          python3 -B tests/autoscroll/ci_v5f_g3c_native_overlay.py
          test -z "$(git status --porcelain)"
      - name: Build actual disposable compositor, Foot, and pinned Wayland client
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/pa-fc1-native-src"
          sway="$(cd "$src" && nix build .#swayfx-unwrapped-git --no-link --print-out-paths --show-trace | tail -n1)"
          foot="$(nix build --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.foot' --no-link --print-out-paths | tail -n1)"
          mesa="$(nix eval --raw --impure --expr 'let f = builtins.getFlake (toString ./.); in f.inputs.nixpkgs.legacyPackages.x86_64-linux.mesa.outPath')"
          proto="$(nix build --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.wayland-protocols' --no-link --print-out-paths | tail -n1)"
          wlr_src="$(nix build --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.wlroots_0_20.src' --no-link --print-out-paths | tail -n1)"
          transient="$proto/share/wayland-protocols/staging/ext-transient-seat/ext-transient-seat-v1.xml"
          pointer="$wlr_src/protocol/wlr-virtual-pointer-unstable-v1.xml"
          test -x "$sway/bin/sway"
          test -x "$sway/bin/swaymsg"
          test -x "$foot/bin/foot"
          test -r "$mesa/share/glvnd/egl_vendor.d/50_mesa.json"
          test -d "$mesa/lib/dri"
          test -r "$transient"
          test -r "$pointer"
          build="$RUNNER_TEMP/pa-g3c-client-build"
          mkdir -m 700 "$build"
          (
            cd "$src"
            nix develop --command bash -euo pipefail -c '
              build="$1"; transient="$2"; pointer="$3"; client="$4"
              wayland-scanner client-header "$transient" \
                "$build/ext-transient-seat-v1-client-protocol.h"
              wayland-scanner private-code "$transient" \
                "$build/ext-transient-seat-v1-protocol.c"
              wayland-scanner client-header "$pointer" \
                "$build/wlr-virtual-pointer-unstable-v1-client-protocol.h"
              wayland-scanner private-code "$pointer" \
                "$build/wlr-virtual-pointer-unstable-v1-protocol.c"
              cc -std=c11 -Wall -Wextra -Werror -pedantic \
                -I"$build" "$client" \
                "$build/ext-transient-seat-v1-protocol.c" \
                "$build/wlr-virtual-pointer-unstable-v1-protocol.c" \
                $(pkg-config --cflags --libs wayland-client) \
                -o "$build/pa-g3c-virtual-owner-client"
            ' _ "$build" "$transient" "$pointer" \
              "$GITHUB_WORKSPACE/tests/autoscroll/ci_v5f_g3c_protocol_client.c"
          )
          test -x "$build/pa-g3c-virtual-owner-client"
          echo "PA_FC1_SWAY=$sway/bin/sway" >> "$GITHUB_ENV"
          echo "PA_FC1_SWAYMSG=$sway/bin/swaymsg" >> "$GITHUB_ENV"
          echo "PA_FC1_FOOT=$foot/bin/foot" >> "$GITHUB_ENV"
          echo "PA_FC1_MESA=$mesa" >> "$GITHUB_ENV"
          echo "PA_G3C_CLIENT=$build/pa-g3c-virtual-owner-client" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain)"
          echo "PA_G3C_FOUR_OWNER_REAL_COMPOSITOR_AND_PROTOCOL_CLIENT_BUILT_PASS"
      - name: Verify five native negative owner revocations with virtual denied
        run: |
          set -euo pipefail
          bash tests/autoscroll/ci_v5f_g3c_udmabuf.sh
          test -z "$(git status --porcelain)"
      - name: Preserve exact evidence limits
        if: always()
        run: |
          echo "Actual native device, seat, target and output lifetimes were read together in one disposable compositor under REAL virtual-Wayland input object provenance, but virtual physical eligibility remained zero." >> "$GITHUB_STEP_SUMMARY"
          echo "G3C injects NO mouse or axis input; a FORGED positive start record and fake layout/scene flags exist only in the CI-only probe for NEGATIVE cancellation tests. Not hardware attestation, real authenticated four-owner scroll authorization, or app delivery." >> "$GITHUB_STEP_SUMMARY"
          echo "Original runtime is HARD OFF, no production source/Meson edited, no Company Map #126 ownership transfer or workstation change, no merge or operator acceptance." >> "$GITHUB_STEP_SUMMARY"
