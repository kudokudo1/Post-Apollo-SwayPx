name: SwayPX / V5E-B Shared Cursor Source Probe (HARD OFF)

on:
  pull_request:
    paths:
      - 'sway/input/cursor.c'
      - 'sway/input/post_apollo_autoscroll_runtime.c'
      - 'include/sway/input/post_apollo_autoscroll_runtime.h'
      - 'sway/input/post_apollo_autoscroll_source.c'
      - 'sway/input/post_apollo_autoscroll_topology.c'
      - 'include/sway/input/post_apollo_autoscroll_topology.h'
      - 'sway/input/post_apollo_autoscroll_lifetime.c'
      - 'include/sway/input/post_apollo_autoscroll_lifetime.h'
      - 'tests/post_apollo_autoscroll_topology_test.c'
      - 'tests/post_apollo_autoscroll_lifetime_test.c'
      - 'MODEL/autoscroll-v5e-c-topology-lifetime.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-c-topology-lifetime.yml'
      - 'sway/input/post_apollo_autoscroll_source_stub.c'
      - 'include/sway/input/post_apollo_autoscroll_source.h'
      - 'sway/meson.build'
      - 'sway/input/input-manager.c'
      - 'include/sway/input/input-manager.h'
      - 'tests/autoscroll/test_v5e_d1_device_lifecycle.py'
      - 'MODEL/autoscroll-v5e-d1-device-lifecycle.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-d1-device-lifecycle.yml'
      - 'tests/autoscroll/test_v5e_shared_ingress.py'
      - 'MODEL/autoscroll-v5e-b-shared-cursor-probe.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-b-shared-ingress.yml'
      - 'sway/input/seat.c'
      - 'include/sway/input/seat.h'
      - 'tests/autoscroll/test_v5e_d2_seat_lifecycle.py'
      - 'MODEL/autoscroll-v5e-d2-seat-lifecycle.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-d2-seat-lifecycle.yml'
      - 'sway/tree/container.c'
      - 'include/sway/tree/container.h'
      - 'tests/autoscroll/test_v5e_d3a_target_lifecycle.py'
      - 'MODEL/autoscroll-v5e-d3a-target-lifecycle.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-d3a-target-lifecycle.yml'
      - 'sway/tree/output.c'
      - 'include/sway/output.h'
      - 'tests/autoscroll/test_v5e_d3b_output_lifecycle.py'
      - 'MODEL/autoscroll-v5e-d3b-output-lifecycle.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-d3b-output-lifecycle.yml'
      - 'sway/config/output.c'
      - 'tests/autoscroll/test_v5e_d3c_output_config_epoch.py'
      - 'MODEL/autoscroll-v5e-d3c-output-configuration.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-d3c-output-config.yml'
      - 'sway/input/post_apollo_autoscroll_owner_snapshot.c'
      - 'include/sway/input/post_apollo_autoscroll_owner_snapshot.h'
      - 'tests/autoscroll/test_v5f_owner_snapshot.py'
      - 'tests/post_apollo_autoscroll_v5f_owner_guard_test.c'
      - 'MODEL/autoscroll-v5f-a-owner-snapshot.md'
      - '.github/workflows/post-apollo-autoscroll-v5f-a-owner-snapshot.yml'
      - '.github/workflows/post-apollo-autoscroll-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-shared-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head and its parent
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify only the scoped shared cursor changes and still hard OFF
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = subprocess.check_output(
              ["git","merge-base","HEAD",
               "origin/autoscroll/v5e-a-origin-policy-20261119"],
              text=True).strip()
          changed = set(subprocess.check_output(
              ["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          allowed = {
              ".github/workflows/post-apollo-autoscroll-core.yml",
              "sway/input/post_apollo_autoscroll_owner_snapshot.c",
              "include/sway/input/post_apollo_autoscroll_owner_snapshot.h",
              "tests/autoscroll/test_v5f_owner_snapshot.py",
              "tests/post_apollo_autoscroll_v5f_owner_guard_test.c",
              "MODEL/autoscroll-v5f-a-owner-snapshot.md",
              ".github/workflows/post-apollo-autoscroll-v5f-a-owner-snapshot.yml",

              "include/sway/input/post_apollo_autoscroll_source.h",
              "sway/input/post_apollo_autoscroll_source.c",
              "sway/input/post_apollo_autoscroll_topology.c",
              "include/sway/input/post_apollo_autoscroll_topology.h",
              "sway/input/post_apollo_autoscroll_lifetime.c",
              "include/sway/input/post_apollo_autoscroll_lifetime.h",
              "tests/post_apollo_autoscroll_topology_test.c",
              "tests/post_apollo_autoscroll_lifetime_test.c",
              "MODEL/autoscroll-v5e-c-topology-lifetime.md",
              ".github/workflows/post-apollo-autoscroll-v5e-c-topology-lifetime.yml",
              "sway/input/post_apollo_autoscroll_source_stub.c",
              "include/sway/input/post_apollo_autoscroll_runtime.h",
              "sway/input/post_apollo_autoscroll_runtime.c",
              "sway/input/cursor.c",
              "sway/meson.build",
              "sway/config/output.c",
              "tests/autoscroll/test_v5e_d3c_output_config_epoch.py",
              "MODEL/autoscroll-v5e-d3c-output-configuration.md",
              ".github/workflows/post-apollo-autoscroll-v5e-d3c-output-config.yml",
              "sway/tree/output.c",
              "include/sway/output.h",
              "tests/autoscroll/test_v5e_d3b_output_lifecycle.py",
              "MODEL/autoscroll-v5e-d3b-output-lifecycle.md",
              ".github/workflows/post-apollo-autoscroll-v5e-d3b-output-lifecycle.yml",
              "sway/tree/container.c",
              "include/sway/tree/container.h",
              "tests/autoscroll/test_v5e_d3a_target_lifecycle.py",
              "MODEL/autoscroll-v5e-d3a-target-lifecycle.md",
              ".github/workflows/post-apollo-autoscroll-v5e-d3a-target-lifecycle.yml",
              "sway/input/seat.c",
              "include/sway/input/seat.h",
              "tests/autoscroll/test_v5e_d2_seat_lifecycle.py",
              "MODEL/autoscroll-v5e-d2-seat-lifecycle.md",
              ".github/workflows/post-apollo-autoscroll-v5e-d2-seat-lifecycle.yml",
              "sway/input/input-manager.c",
              "include/sway/input/input-manager.h",
              "tests/autoscroll/test_v5e_d1_device_lifecycle.py",
              "MODEL/autoscroll-v5e-d1-device-lifecycle.md",
              ".github/workflows/post-apollo-autoscroll-v5e-d1-device-lifecycle.yml",
              "tests/autoscroll/test_v5e_shared_ingress.py",
              ".github/workflows/post-apollo-autoscroll-v5e-b-shared-ingress.yml",
              "MODEL/autoscroll-v5e-b-shared-cursor-probe.md",
          }
          assert changed <= allowed, sorted(changed - allowed)
          forbidden = {"sway/input/seatop_default.c",
                       "sway/desktop/xdg_shell.c",
                       "sway/stage_director_company_input.c",
                       "sway/stage_director_company_scene.c"}
          assert not (changed & forbidden), sorted(changed & forbidden)
          if "sway/input/seat.c" in changed:
              seat = Path("sway/input/seat.c").read_text()
              assert "pa_autoscroll_lifetime_bind(" in seat
              assert "pa_autoscroll_lifetime_revoke(" in seat
              assert Path("tests/autoscroll/test_v5e_d2_seat_lifecycle.py").is_file()
          if "sway/tree/container.c" in changed:
              container = Path("sway/tree/container.c").read_text()
              assert "pa_autoscroll_lifetime_bind(" in container
              assert "pa_autoscroll_lifetime_revoke(" in container
              assert Path("tests/autoscroll/test_v5e_d3a_target_lifecycle.py").is_file()
          if "sway/tree/output.c" in changed:
              output = Path("sway/tree/output.c").read_text()
              assert "pa_autoscroll_lifetime_bind(" in output
              assert "pa_autoscroll_lifetime_revoke(" in output
              assert Path("tests/autoscroll/test_v5e_d3b_output_lifecycle.py").is_file()
          if "sway/config/output.c" in changed:
              config = Path("sway/config/output.c").read_text()
              assert "output_autoscroll_config_committed(cfg->output)" in config
              assert Path("tests/autoscroll/test_v5e_d3c_output_config_epoch.py").is_file()
          if "sway/input/post_apollo_autoscroll_owner_snapshot.c" in changed:
              source = Path("sway/input/post_apollo_autoscroll_owner_snapshot.c").read_text()
              assert "find_live_native_pointer(event_device)" in source
              assert "wlr_output_layout_output_at(" in source
              assert Path("tests/autoscroll/test_v5f_owner_snapshot.py").is_file()
              assert "'input/post_apollo_autoscroll_owner_snapshot.c'" in Path("sway/meson.build").read_text()
          runtime = Path("sway/input/post_apollo_autoscroll_runtime.c").read_text()
          assert "#define PA_AUTOSCROLL_LIVE_ACTIVATION 0" in runtime
          assert "const bool physical_verified = false;" in runtime
          assert "const bool native_scroll_lock_active = true;" in runtime
          assert "pa_scroll_dispatch_enable(" not in runtime
          print("PA_AUTOSCROLL_V5E_B_SHARED_CURSOR_SCOPE_PASS")
          PY
          python3 -m unittest discover -s tests/autoscroll \
            -p 'test_default_off_compositor_hook.py' -v
          python3 -m unittest discover -s tests/autoscroll \
            -p 'test_v5e_shared_ingress.py' -v
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude \
            sway/input/post_apollo_autoscroll_origin_policy.c \
            tests/post_apollo_autoscroll_origin_policy_test.c \
            -o /tmp/pa-v5e-b-origin-policy
          timeout 5s /tmp/pa-v5e-b-origin-policy
      - name: Install Nix in disposable GitHub runner
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Build and link real SwayPX with libinput source probe, no deployment
        run: |
          set -euo pipefail
          nix build .#swayfx-unwrapped-git --no-link --print-out-paths --show-trace \
            | tee "$RUNNER_TEMP/v5e-b-swaypx-path.txt"
          executable="$(tail -n 1 "$RUNNER_TEMP/v5e-b-swaypx-path.txt")/bin/sway"
          test -x "$executable"
          echo "PA_AUTOSCROLL_V5E_B_PRODUCTION_HARD_OFF_BUILD_PASS"
      - name: Declare limitation
        if: always()
        run: |
          echo "This CI builds SwayPX with a non-authorizing candidate probe after Stage Director pairing." >> "$GITHUB_STEP_SUMMARY"
          echo "It does not demonstrate genuine physical provenance, real mouse events, or active autoscroll." >> "$GITHUB_STEP_SUMMARY"
          echo "No operator desktop services or files are modified." >> "$GITHUB_STEP_SUMMARY"
