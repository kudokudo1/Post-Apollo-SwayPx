name: SwayPX / V5E-D3B Output Enable/Disable Lifetime (HARD OFF)

on:
  pull_request:
    paths:
      - 'sway/tree/output.c'
      - 'include/sway/output.h'
      - 'tests/autoscroll/test_v5e_d3b_output_lifecycle.py'
      - 'MODEL/autoscroll-v5e-d3b-output-lifecycle.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-d3b-output-lifecycle.yml'
      - 'sway/config/output.c'
      - 'tests/autoscroll/test_v5e_d3c_output_config_epoch.py'
      - 'MODEL/autoscroll-v5e-d3c-output-configuration.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-d3c-output-config.yml'
      - 'sway/input/post_apollo_autoscroll_owner_snapshot.c'
      - 'include/sway/input/post_apollo_autoscroll_owner_snapshot.h'
      - 'tests/autoscroll/test_v5f_owner_snapshot.py'
      - 'tests/post_apollo_autoscroll_v5f_owner_guard_test.c'
      - 'MODEL/autoscroll-v5f-a-owner-snapshot.md'
      - '.github/workflows/post-apollo-autoscroll-v5f-a-owner-snapshot.yml'
      - 'sway/meson.build'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  output-availability-source-and-native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch and parent
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce output-only owner diff and no runtime authorization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base=subprocess.check_output(
              ["git","merge-base","HEAD",
               "origin/autoscroll/v5e-d3a-target-lifetime-20261119"],
              text=True).strip()
          paths=set(subprocess.check_output(
              ["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          allowed={
              "sway/input/post_apollo_autoscroll_owner_snapshot.c",
              "include/sway/input/post_apollo_autoscroll_owner_snapshot.h",
              "tests/autoscroll/test_v5f_owner_snapshot.py",
              "tests/post_apollo_autoscroll_v5f_owner_guard_test.c",
              "MODEL/autoscroll-v5f-a-owner-snapshot.md",
              ".github/workflows/post-apollo-autoscroll-v5f-a-owner-snapshot.yml",
              "sway/meson.build",

              "sway/tree/output.c",
              "sway/config/output.c",
              "tests/autoscroll/test_v5e_d3c_output_config_epoch.py",
              "MODEL/autoscroll-v5e-d3c-output-configuration.md",
              ".github/workflows/post-apollo-autoscroll-v5e-d3c-output-config.yml",
              "include/sway/output.h",
              "tests/autoscroll/test_v5e_d3b_output_lifecycle.py",
              "MODEL/autoscroll-v5e-d3b-output-lifecycle.md",
              ".github/workflows/post-apollo-autoscroll-v5e-d3b-output-lifecycle.yml",
              ".github/workflows/post-apollo-autoscroll-v5e-d3a-target-lifecycle.yml",
              ".github/workflows/post-apollo-autoscroll-v5e-d2-seat-lifecycle.yml",
              ".github/workflows/post-apollo-autoscroll-v5e-d1-device-lifecycle.yml",
              ".github/workflows/post-apollo-autoscroll-v5e-c-topology-lifetime.yml",
              ".github/workflows/post-apollo-autoscroll-v5e-b-shared-ingress.yml",
          }
          assert paths <= allowed, sorted(paths-allowed)
          # The D3B base now includes merged output lifetime hooks.
          output_source = Path("sway/tree/output.c").read_text()
          assert "pa_autoscroll_lifetime_bind(" in output_source
          assert "pa_autoscroll_lifetime_revoke(" in output_source
          forbidden={
              "sway/input/cursor.c","sway/input/seat.c",
              "include/sway/input/seat.h","sway/input/input-manager.c",
              "sway/tree/container.c","include/sway/tree/container.h",
              "sway/desktop/output.c",
              "sway/desktop/xdg_shell.c","sway/desktop/transaction.c",
              "sway/input/seatop_down.c",
              "sway/stage_director_company_input.c",
              "sway/stage_director_company_scene.c",
              "sway/input/post_apollo_autoscroll_runtime.c",
          }
          assert not (paths & forbidden), sorted(paths & forbidden)
          if "sway/config/output.c" in paths:
              config = Path("sway/config/output.c").read_text()
              assert "output_autoscroll_config_committed(cfg->output)" in config
              assert Path("tests/autoscroll/test_v5e_d3c_output_config_epoch.py").is_file()
          if "sway/input/post_apollo_autoscroll_owner_snapshot.c" in paths:
              source = Path("sway/input/post_apollo_autoscroll_owner_snapshot.c").read_text()
              assert "find_live_native_pointer(event_device)" in source
              assert "wlr_output_layout_output_at(" in source
              assert Path("tests/autoscroll/test_v5f_owner_snapshot.py").is_file()
              assert "'input/post_apollo_autoscroll_owner_snapshot.c'" in Path("sway/meson.build").read_text()
          runtime=Path("sway/input/post_apollo_autoscroll_runtime.c").read_text()
          assert "#define PA_AUTOSCROLL_LIVE_ACTIVATION 0" in runtime
          assert "const bool physical_verified = false;" in runtime
          assert "const bool native_scroll_lock_active = true;" in runtime
          assert "pa_scroll_dispatch_enable(" not in runtime
          print("PA_V5E_D3B_OUTPUT_ONLY_ZERO_COMPANY_OVERLAP_PASS")
          PY
      - name: Strict C11 lifetime tests and real source lifecycle regressions
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude \
            sway/input/post_apollo_autoscroll_lifetime.c \
            tests/post_apollo_autoscroll_lifetime_test.c \
            -o /tmp/pa-v5e-d3b-tokens
          timeout 5s /tmp/pa-v5e-d3b-tokens
          for test in test_v5e_d3b_output_lifecycle.py \
                      test_v5e_d3a_target_lifecycle.py \
                      test_v5e_d2_seat_lifecycle.py \
                      test_v5e_d1_device_lifecycle.py \
                      test_default_off_compositor_hook.py \
                      test_v5e_shared_ingress.py; do
            python3 -m unittest discover -s tests/autoscroll -p "$test" -v
          done
      - name: Install Nix in isolated GitHub runner
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Build and link production-hard-OFF SwayPX with output epochs
        run: |
          set -euo pipefail
          out="$(nix build .#swayfx-unwrapped-git --no-link --print-out-paths --show-trace | tail -n1)"
          test -x "$out/bin/sway"
          echo "PA_V5E_D3B_REAL_OUTPUT_AVAILABILITY_LIFETIME_SWAYPX_PASS"
      - name: Declare evidence limits
        if: always()
        run: |
          echo "This validates actual output_enable/disable/begin_destroy source callbacks and full native SwayPX build." >> "$GITHUB_STEP_SUMMARY"
          echo "Output coordinate/resolution/scale changes while enabled are NOT epoch-guarded by this package." >> "$GITHUB_STEP_SUMMARY"
          echo "No dynamic monitor hotplug token witness or active autoscroll is proven. Production stays OFF." >> "$GITHUB_STEP_SUMMARY"
