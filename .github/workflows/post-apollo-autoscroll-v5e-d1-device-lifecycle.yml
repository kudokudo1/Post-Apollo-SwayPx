name: SwayPX / V5E-D1 Real Device Lifetime Hooks (HARD OFF)

on:
  pull_request:
    paths:
      - 'sway/input/input-manager.c'
      - 'include/sway/input/input-manager.h'
      - 'sway/meson.build'
      - 'tests/autoscroll/test_v5e_d1_device_lifecycle.py'
      - 'MODEL/autoscroll-v5e-d1-device-lifecycle.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-d1-device-lifecycle.yml'
      - 'sway/input/seat.c'
      - 'include/sway/input/seat.h'
      - 'tests/autoscroll/test_v5e_d2_seat_lifecycle.py'
      - 'MODEL/autoscroll-v5e-d2-seat-lifecycle.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-d2-seat-lifecycle.yml'
      - 'sway/tree/container.c'
      - 'include/sway/tree/container.h'
      - 'tests/autoscroll/test_v5e_d3a_target_lifecycle.py'
      - 'MODEL/autoscroll-v5e-d3a-target-lifecycle.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-d3a-target-lifecycle.yml'
      - 'sway/tree/output.c'
      - 'include/sway/output.h'
      - 'tests/autoscroll/test_v5e_d3b_output_lifecycle.py'
      - 'MODEL/autoscroll-v5e-d3b-output-lifecycle.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-d3b-output-lifecycle.yml'
      - 'sway/config/output.c'
      - 'tests/autoscroll/test_v5e_d3c_output_config_epoch.py'
      - 'MODEL/autoscroll-v5e-d3c-output-configuration.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-d3c-output-config.yml'
      - 'include/sway/input/post_apollo_autoscroll_epoch.h'
      - 'sway/input/post_apollo_autoscroll_epoch.c'
      - 'include/sway/input/post_apollo_autoscroll_snapshot.h'
      - 'sway/input/post_apollo_autoscroll_snapshot.c'
      - 'tests/post_apollo_autoscroll_f1_guard_join_test.c'
      - 'tests/autoscroll/test_v5e_f1_real_snapshot.py'
      - 'MODEL/autoscroll-v5e-f1-real-snapshot.md'
      - '.github/workflows/post-apollo-autoscroll-v5e-f1-owner-snapshot.yml'
      - '.github/workflows/post-apollo-autoscroll-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-device-lifecycle-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source and parent
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require bounded real device-lifecycle callback integration, no live gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = subprocess.check_output(
              ["git", "merge-base", "HEAD",
               "origin/autoscroll/v5e-c-topology-lifetime-20261119"],
              text=True).strip()
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"],
              text=True).splitlines())
          allowed = {
              "include/sway/input/input-manager.h",
              "sway/input/input-manager.c",
              "sway/meson.build",
              "include/sway/input/post_apollo_autoscroll_epoch.h",
              "sway/input/post_apollo_autoscroll_epoch.c",
              "include/sway/input/post_apollo_autoscroll_snapshot.h",
              "sway/input/post_apollo_autoscroll_snapshot.c",
              "tests/post_apollo_autoscroll_f1_guard_join_test.c",
              "tests/autoscroll/test_v5e_f1_real_snapshot.py",
              "MODEL/autoscroll-v5e-f1-real-snapshot.md",
              ".github/workflows/post-apollo-autoscroll-v5e-f1-owner-snapshot.yml",
              ".github/workflows/post-apollo-autoscroll-core.yml",
              "sway/config/output.c",
              "tests/autoscroll/test_v5e_d3c_output_config_epoch.py",
              "MODEL/autoscroll-v5e-d3c-output-configuration.md",
              ".github/workflows/post-apollo-autoscroll-v5e-d3c-output-config.yml",
              "sway/tree/output.c",
              "include/sway/output.h",
              "tests/autoscroll/test_v5e_d3b_output_lifecycle.py",
              "MODEL/autoscroll-v5e-d3b-output-lifecycle.md",
              ".github/workflows/post-apollo-autoscroll-v5e-d3b-output-lifecycle.yml",
              "sway/tree/container.c",
              "include/sway/tree/container.h",
              "tests/autoscroll/test_v5e_d3a_target_lifecycle.py",
              "MODEL/autoscroll-v5e-d3a-target-lifecycle.md",
              ".github/workflows/post-apollo-autoscroll-v5e-d3a-target-lifecycle.yml",
              "sway/input/seat.c",
              "include/sway/input/seat.h",
              "tests/autoscroll/test_v5e_d2_seat_lifecycle.py",
              "MODEL/autoscroll-v5e-d2-seat-lifecycle.md",
              ".github/workflows/post-apollo-autoscroll-v5e-d2-seat-lifecycle.yml",
              "tests/autoscroll/test_v5e_d1_device_lifecycle.py",
              "MODEL/autoscroll-v5e-d1-device-lifecycle.md",
              ".github/workflows/post-apollo-autoscroll-v5e-d1-device-lifecycle.yml",
              ".github/workflows/post-apollo-autoscroll-v5e-b-shared-ingress.yml",
              ".github/workflows/post-apollo-autoscroll-v5e-c-topology-lifetime.yml",
          }
          assert changed <= allowed, sorted(changed - allowed)
          forbidden = {
              "sway/input/cursor.c", "sway/desktop/output.c",
              "sway/desktop/xdg_shell.c",
              "sway/input/post_apollo_autoscroll_runtime.c",
              "include/sway/input/post_apollo_autoscroll_runtime.h",
          }
          assert not (changed & forbidden), sorted(changed & forbidden)
          if "sway/input/seat.c" in changed:
              seat = Path("sway/input/seat.c").read_text()
              assert "pa_autoscroll_lifetime_bind(" in seat
              assert "pa_autoscroll_lifetime_revoke(" in seat
              assert Path("tests/autoscroll/test_v5e_d2_seat_lifecycle.py").is_file()
          if "sway/tree/container.c" in changed:
              container = Path("sway/tree/container.c").read_text()
              assert "pa_autoscroll_lifetime_bind(" in container
              assert "pa_autoscroll_lifetime_revoke(" in container
              assert Path("tests/autoscroll/test_v5e_d3a_target_lifecycle.py").is_file()
          if "sway/tree/output.c" in changed:
              output = Path("sway/tree/output.c").read_text()
              assert "pa_autoscroll_lifetime_bind(" in output
              assert "pa_autoscroll_lifetime_revoke(" in output
              assert Path("tests/autoscroll/test_v5e_d3b_output_lifecycle.py").is_file()
          if "sway/config/output.c" in changed:
              config = Path("sway/config/output.c").read_text()
              assert "output_autoscroll_config_committed(cfg->output)" in config
              assert Path("tests/autoscroll/test_v5e_d3c_output_config_epoch.py").is_file()
          if "sway/input/post_apollo_autoscroll_snapshot.c" in changed:
              snapshot = Path("sway/input/post_apollo_autoscroll_snapshot.c").read_text()
              assert "input_manager_autoscroll_pointer_lifetime_epoch(" in snapshot
              assert "seat_autoscroll_lifetime_epoch(" in snapshot
              assert "container_autoscroll_target_lifetime_epoch(" in snapshot
              assert "output_autoscroll_lifetime_epoch(" in snapshot
              assert "pa_scroll_dispatch_enable(" not in snapshot
              meson = Path("sway/meson.build").read_text()
              assert "'input/post_apollo_autoscroll_snapshot.c'" in meson
              assert "'input/post_apollo_autoscroll_epoch.c'" in meson
              assert "'input/post_apollo_autoscroll_witness.c'" in meson
          runtime = Path("sway/input/post_apollo_autoscroll_runtime.c").read_text()
          assert "#define PA_AUTOSCROLL_LIVE_ACTIVATION 0" in runtime
          assert "const bool physical_verified = false;" in runtime
          assert "const bool native_scroll_lock_active = true;" in runtime
          assert "pa_scroll_dispatch_enable(" not in runtime
          print("PA_V5E_D1_ACTUAL_DEVICE_HOOK_SCOPE_HARD_OFF_PASS")
          PY
      - name: Strict C11 portable lifetime refusal test
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude \
            sway/input/post_apollo_autoscroll_lifetime.c \
            tests/post_apollo_autoscroll_lifetime_test.c \
            -o /tmp/pa-v5ed1-lifetime
          timeout 5s /tmp/pa-v5ed1-lifetime
      - name: Verify compositor callbacks, virtual denial, revoked-before-detach
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/autoscroll \
            -p 'test_v5e_d1_device_lifecycle.py' -v
          python3 -m unittest discover -s tests/autoscroll \
            -p 'test_default_off_compositor_hook.py' -v
          python3 -m unittest discover -s tests/autoscroll \
            -p 'test_v5e_shared_ingress.py' -v
      - name: Install Nix in disposable runner
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Compile and link actual production-hard-OFF SwayPX
        run: |
          set -euo pipefail
          sway="$(nix build .#swayfx-unwrapped-git --no-link --print-out-paths --show-trace | tail -n1)"
          test -x "$sway/bin/sway"
          echo "PA_V5E_D1_ACTUAL_COMPOSITOR_BUILD_PASS"
      - name: Proof limitations
        if: always()
        run: |
          echo "This validates actual C hook source and a real SwayPX build: input-manager new physical/virtual pointer and device teardown now issue/revoke distinct device epochs." >> "$GITHUB_STEP_SUMMARY"
          echo "The native callbacks are source-checked and linked, but no dedicated live event-issued token witness has been captured in this workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "Seat/target/output hooks and physical device authority remain unimplemented. Production autoscroll is hard OFF." >> "$GITHUB_STEP_SUMMARY"
