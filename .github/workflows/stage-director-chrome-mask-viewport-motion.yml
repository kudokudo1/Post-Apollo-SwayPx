name: Stage Director real Chrome stationary XDG moving mask (CI)

on:
  pull_request:
    branches:
      - master
      - stage-director/chrome-per-view-decoration-20261031
    paths:
      - 'sway/stage_director_ci_scene_probe.c'
      - 'sway/desktop/xdg_shell.c'
      - 'include/sway/stage_director_ci_scene_probe.h'
      - 'sway/tree/view.c'
      - 'include/sway/stage_director_ci_scene_probe.h'
      - 'tests/stage_director/headless_sway_smoke.sh'
      - 'tests/stage_director/ci_real_chrome_pixel_compositor.nix'
      - 'tests/stage_director/ci_real_chrome_wayland_window.py'
      - 'tests/stage_director/assert_real_chrome_clip_pixels.py'
      - 'tests/stage_director/assert_real_chrome_mask_shift_pixels.py'
      - 'tests/stage_director/assert_real_chrome_multi_mask_pixels.py'
      - 'tests/stage_director/assert_real_chrome_abrupt_exit_pixels.py'
      - 'tests/stage_director/assert_real_chrome_pending_exit_pixels.py'
      - 'tests/stage_director/ci_xdg_popup_witness.c'
      - 'tests/stage_director/ci_xdg_popup_witness.nix'
      - 'tests/stage_director/ci_chrome_popup_service.sh'
      - 'tests/stage_director/assert_real_xdg_popup_witness_pixels.py'
      - 'docs/stage-director-chrome-pending-exit-20261102.md'
      - '.github/workflows/stage-director-chrome-mask-viewport-motion.yml'
      - 'docs/stage-director-chrome-mask-viewport-motion-20261102.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixel-source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Per-actor source boundary and unrelated-view protection
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          import ast
          p=Path("sway/stage_director_ci_scene_probe.c").read_text()
          xdg=Path("sway/desktop/xdg_shell.c").read_text()
          native_header=Path("include/sway/stage_director_ci_scene_probe.h").read_text()
          pix=Path("tests/stage_director/assert_real_chrome_clip_pixels.py").read_text()
          mask=Path("tests/stage_director/assert_real_chrome_mask_shift_pixels.py").read_text()
          multiple=Path("tests/stage_director/assert_real_chrome_multi_mask_pixels.py").read_text()
          abrupt=Path("tests/stage_director/assert_real_chrome_abrupt_exit_pixels.py").read_text()
          pending=Path("tests/stage_director/assert_real_chrome_pending_exit_pixels.py").read_text()
          popup_client=Path("tests/stage_director/ci_xdg_popup_witness.c").read_text()
          popup_service=Path("tests/stage_director/ci_chrome_popup_service.sh").read_text()
          popup_pixels=Path("tests/stage_director/assert_real_xdg_popup_witness_pixels.py").read_text()
          popup_nix=Path("tests/stage_director/ci_xdg_popup_witness.nix").read_text()
          test=Path("tests/stage_director/ci_real_chrome_wayland_window.py").read_text()
          assert "SD_CI_CHROME_MASK_SHIFT_PIXELS: result=PASS" in mask
          assert "FAIL_NATIVE_CHROME_WINDOW_MOVED_OR_REPLACED" in mask
          assert "FAIL_STALE_CHROME_PIXELS_OLD_MASK" in mask
          assert "FAIL_NEW_EXPANDED_MASK_NOT_VISIBLE" in mask
          assert "FAIL_NEW_MASK_LEAKED_PIXELS_OUTSIDE" in mask
          assert 'stage_director_ci_scene_probe_restore(view);' in p
          assert 'strcmp(runner, "/home/runner/work/_temp") != 0' in p
          assert 'O_RDONLY | O_CLOEXEC | O_NOFOLLOW' in p
          assert 'S_ISREG(st.st_mode)' in p
          assert 'ci_real_chrome_process(view, &peer)' in p
          assert 'SD_CI_CHROME_MASK_REBIND' in p
          assert 'ci_mask_request_timer' in p
          # Sway normally puts real XDG popups in a global root scene tree,
          # separate from the browser content that CI's mask clips.
          assert 'root->layers.popup' in xdg
          assert 'popup_create(wlr_popup, popup->view' in xdg
          assert xdg.count('stage_director_ci_scene_probe_reject_chrome_popup(') == 2
          assert xdg.count('wlr_xdg_popup_destroy(wlr_popup);') == 2
          assert xdg.count('#ifdef SD_STAGE_DIRECTOR_CI_SCENE_PROBE') >= 3
          assert 'stage_director_ci_scene_probe_reject_chrome_popup(' in native_header
          assert 'const bool selected = view == ci_render_actor;' in p
          assert 'if (!selected && !current) return false;' in p
          assert 'SD_CI_CHROME_POPUP_DENIED' in p
          assert 'global_popup_tree=BLOCKED authority=NONE' in p
          assert 'return true;' in p
          assert 'ci_real_chrome_process(view, &peer)' in p
          assert 'const struct wlr_box phase2_rect' in p
          assert 'const struct wlr_box phase3_rect' in p
          assert 'SD_CI_CHROME_MASK_REBIND_PHASE3' in p
          assert 'memcmp(bytes, "PHASE3\\n", 7) == 0' in p
          assert 'ci_mask_third_applied' in p
          assert 'SD_CI_CHROME_MULTI_MASK_PIXELS: result=PASS' in multiple
          assert 'FAIL_STALE_CHROME_PIXELS_PREVIOUS_MASKS' in multiple
          assert 'FAIL_THIRD_CHROME_MASK_FOUR_EDGE_LEAK' in multiple
          assert 'SD_CI_CHROME_ABRUPT_EXIT_PIXELS: result=PASS' in abrupt
          assert 'FAIL_ABORT_STALE_CHROME_PIXELS_AFTER_SIGKILL' in abrupt
          assert 'FAIL_ABORT_NATIVE_XDG_STILL_MAPPED' in abrupt
          assert 'SD_CI_RENDER_PIXEL clip_restored_on_unmap=1' in test
          assert 'systemctl", "kill"' in test
          assert '"--signal=SIGKILL", "--kill-whom=all", unit' in test
          assert 'STAGE_DIRECTOR_CI_CHROME_ABRUPT_EXIT' in test
          assert 'sd-chrome-abrupt-exit.ppm' in test
          assert 'sd-chrome-mask-third.ppm' in test
          assert 'b"PHASE3\\n"' in test
          assert 'SD_CI_CHROME_MASK_PENDING_HELD' in p
          assert 'SD_CI_CHROME_MASK_PENDING_REVOKED' in p
          assert 'memcmp(bytes, "PENDING\\n", 8) != 0' in p
          assert 'SD_CI_CHROME_PENDING_REQUEST_ABORT: result=PASS' in test
          assert 'b"PENDING\\n"' in test
          assert 'STAGE_DIRECTOR_CI_CHROME_PENDING_EXIT' in test
          assert 'FAIL_PENDING_STALE_CHROME_PIXELS_AFTER_SIGKILL' in pending
          assert 'SD_CI_CHROME_PENDING_EXIT_PIXELS: result=PASS' in pending
          assert "STAGE_DIRECTOR_CI_BROWSER_MASK" in test
          assert 'os.O_CREAT | os.O_EXCL | os.O_WRONLY' in test
          assert 'sd-chrome-mask-shift.ppm' in test
          ast.parse(mask)
          ast.parse(multiple)
          ast.parse(abrupt)
          ast.parse(pending)
          ast.parse(popup_pixels)
          assert 'xdg_surface_get_popup(s.popup_xdg, s.parent_xdg' in popup_client
          assert 'SD_CI_NATIVE_XDG_POPUP_REQUEST_SENT' in popup_client
          assert 'SD_CI_NATIVE_XDG_POPUP_BUFFER_ATTACHED' in popup_client
          assert 'sd-ci-popup-witness' in popup_client
          assert 'SD_CI_NATIVE_POPUP_DENIAL_PIXELS: result=PASS' in popup_pixels
          assert 'FAIL_NATIVE_POPUP_POSITIVE_CONTROL_NOT_RENDERED' in popup_pixels
          assert 'FAIL_NATIVE_POPUP_GLOBAL_ROOT_PIXEL_ESCAPE' in popup_pixels
          assert 'sd-ci-xdg-popup-$GITHUB_RUN_ID' in popup_service
          assert '"$witness" emit &' in popup_service
          assert 'pkgs.wayland-protocols' in popup_nix
          assert 'STAGE_DIRECTOR_CI_CHROME_POPUP_WITNESS' in test
          assert 'verify_native_popup_witness(' in test
          assert 'SD_CI_XDG_POPUP_NATIVE_EVENT: result=PASS' in test
          nix=Path("tests/stage_director/ci_real_chrome_pixel_compositor.nix").read_text()
          runtime=Path("tests/stage_director/headless_sway_smoke.sh").read_text()
          assert "default_border normal" in runtime
          assert "default_floating_border normal" in runtime
          assert "default_border pixel 0" not in runtime
          assert "default_floating_border pixel 0" not in runtime
          assert "SD_CI_CHROME_DECORATION_SAFETY" in runtime
          assert "BLOCKED_NON_CI_CHROME_PER_VIEW_DECORATION" in runtime

          options=Path("meson_options.txt").read_text()
          assert "option('sd-ci-news-scene-probe', type: 'boolean', value: false" in options
          assert '"-Dsd-ci-news-scene-probe=true"' in nix
          assert 'ci_real_chrome_process(' in p
          view=Path("sway/tree/view.c").read_text()
          header=Path("include/sway/stage_director_ci_scene_probe.h").read_text()
          assert "stage_director_ci_scene_probe_borderless_verified_actor(" in p
          assert "stage_director_ci_scene_probe_borderless_verified_actor(view);" in view
          assert "#ifdef SD_STAGE_DIRECTOR_CI_SCENE_PROBE" in view
          assert "view->container->pending.border = B_NONE;" in p
          assert "view->container->pending.border_thickness = 0;" in p
          assert "stage_director_ci_scene_probe_borderless_verified_actor(" in header
          assert "SD_CI_UNRELATED_DECORATION:" in test
          assert 'control.get("border") != "normal"' in test
          assert 'actor.get("border") != "none"' in test
          assert "SD_CI_CHROME_PER_VIEW_DECORATION:" in test

          assert 'wl_resource_get_client(view->surface->resource)' in p
          assert 'wl_client_get_credentials(client, &peer, &uid, &gid)' in p
          assert 'observed.start_time_ticks == 0' in p
          assert '"/proc/%ld/cgroup"' in p
          assert 'strcmp(line + n - suffix, expected) == 0' in p
          assert 'SD_CI_CHROME_PIXEL_SCENE' in p
          assert 'render_pixels=UNVERIFIED authority=NONE' in p
          assert 'ci_render_actor = view;' in p
          assert 'wlr_scene_subsurface_tree_set_clip(' in p
          for line in ('before.ppm', 'sd-chrome-crop.ppm', 'sd-chrome-crop.png',
                       'assert_real_chrome_clip_pixels.py'):
              assert line in test or line in pix, line
          for line in ('(x + 24, y + 160)', '(x + 160, y + 24)',
                       '(x + 450, y + 150)', '(x + 160, y + 370)'):
              assert line in pix, line
          assert 'FAIL: real browser pixels leak beyond viewport' in pix
          assert 'SD_CI_REAL_CHROME_RENDER_PIXELS:' in pix
          assert '"--no-sandbox"' not in test
          assert '"--disable-setuid-sandbox"' not in test
          for path in ('sway/stage_director.c',
                       'sway/stage_director_weather_watch_protocol.c',
                       'sway/stage_director_news_supervisor.c'):
              assert 'ci_real_chrome_pixel_probe' not in Path(path).read_text()
          ast.parse(test)
          ast.parse(pix)
          print("SD_CI_REAL_CHROME_PIXEL_BOUNDARY: "
                "native client+cgroup only, screenshot required, "
                "no prod/browser WATCH authority PASS")
          PY

  real-chrome-four-edge-pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        exit_mode: [after-third-mask, pending-before-move, native-popup-denial]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Compile normal SwayPX without a test-only browser pixel selector
        run: |
          set -euo pipefail
          prod="$(nix build .#swayfx-unwrapped-git --no-link --print-out-paths --show-trace | tail -n 1)"
          test -x "$prod/bin/sway"
          if grep -aFq 'SD_CI_CHROME_PIXEL_SCENE' "$prod/bin/sway"; then
            echo "FAIL: browser scene test selector linked into production" >&2
            exit 1
          fi
          # Both the actor-only policy and pixel selector are test-only.
          if grep -aFq 'SD_CI_CHROME_PER_VIEW_BORDER' "$prod/bin/sway"; then
            echo "FAIL: per-actor test-only decoration policy linked into production" >&2
            exit 1
          fi
          if grep -aFq 'SD_CI_CHROME_POPUP_DENIED' "$prod/bin/sway"; then
            echo "FAIL: test-only Chrome popup denial leaked into normal production" >&2
            exit 1
          fi
          echo "SD_CI_CHROME_PROD_BOUNDARY compiled_without_test_selector=1 PASS"
      - name: Compile test-only compositor and screenshot client separately
        run: |
          set -euo pipefail
          ci="$(nix build --impure --expr 'import ./tests/stage_director/ci_real_chrome_pixel_compositor.nix' --no-link --print-out-paths --show-trace | tail -n 1)"
          test -x "$ci/bin/sway"
          test -x "$ci/bin/swaymsg"
          grep -aFq 'SD_CI_CHROME_PIXEL_SCENE' "$ci/bin/sway"
          grep -aFq 'SD_CI_CHROME_POPUP_DENIED' "$ci/bin/sway"
          echo "CI_COMPOSITOR=$ci" >> "$GITHUB_ENV"
          echo "STAGE_DIRECTOR_TEST_SWAYMSG=$ci/bin/swaymsg" >> "$GITHUB_ENV"
          echo "STAGE_DIRECTOR_CI_REAL_CHROME_WAYLAND=1" >> "$GITHUB_ENV"
          echo "STAGE_DIRECTOR_CI_REAL_CHROME_PIXEL=1" >> "$GITHUB_ENV"
          echo "STAGE_DIRECTOR_CI_BROWSER_MASK=1" >> "$GITHUB_ENV"
          if [[ "${{ matrix.exit_mode }}" == "pending-before-move" ]]; then
            echo "STAGE_DIRECTOR_CI_CHROME_PENDING_EXIT=1" >> "$GITHUB_ENV"
          elif [[ "${{ matrix.exit_mode }}" == "native-popup-denial" ]]; then
            echo "STAGE_DIRECTOR_CI_CHROME_POPUP_WITNESS=1" >> "$GITHUB_ENV"
            echo "STAGE_DIRECTOR_CI_CHROME_ABRUPT_EXIT=1" >> "$GITHUB_ENV"
          else
            echo "STAGE_DIRECTOR_CI_CHROME_ABRUPT_EXIT=1" >> "$GITHUB_ENV"
          fi
          echo "STAGE_DIRECTOR_CI_FRAME_DEST_OVERRIDE=1" >> "$GITHUB_ENV"
          echo "STAGE_DIRECTOR_CI_RENDER_NORMALIZE=1" >> "$GITHUB_ENV"
          echo "STAGE_DIRECTOR_CI_RENDER_PROBE=1" >> "$GITHUB_ENV"
          mesa="$(nix eval --raw --impure --expr 'let f = builtins.getFlake (toString ./.); in f.inputs.nixpkgs.legacyPackages.x86_64-linux.mesa.outPath')"
          test -r "$mesa/share/glvnd/egl_vendor.d/50_mesa.json"
          test -d "$mesa/lib/dri"
          echo "STAGE_DIRECTOR_MESA_DIR=$mesa" >> "$GITHUB_ENV"
          grim="$(nix build --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.grim' --no-link --print-out-paths | tail -n 1)"
          test -x "$grim/bin/grim"
          echo "STAGE_DIRECTOR_TEST_GRIM=$grim/bin/grim" >> "$GITHUB_ENV"
          foot="$(nix build --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.foot' --no-link --print-out-paths | tail -n 1)"
          test -x "$foot/bin/foot"
          echo "STAGE_DIRECTOR_TEST_DECOR_CONTROL_FOOT=$foot/bin/foot" >> "$GITHUB_ENV"
          if [[ "${{ matrix.exit_mode }}" == "native-popup-denial" ]]; then
            popup="$(nix build --impure --expr 'import ./tests/stage_director/ci_xdg_popup_witness.nix' --no-link --print-out-paths --show-trace | tail -n 1)"
            test -x "$popup/bin/sd-ci-xdg-popup-witness"
            echo "STAGE_DIRECTOR_TEST_XDG_POPUP_WITNESS=$popup/bin/sd-ci-xdg-popup-witness" >> "$GITHUB_ENV"
          fi
      - name: Boot actual headless SwayPX, Chrome and verify four-edge rendered pixels
        run: |
          set -euo pipefail
          test -x /opt/google/chrome/chrome
          test -r /sys/fs/cgroup/cgroup.controllers
          test -d /run/systemd/system
          bash tests/stage_director/ci_udmabuf_smoke.sh "$CI_COMPOSITOR/bin/sway"
      - name: Preserve actual disposable screenshots for failure analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sd-ci-chrome-${{ matrix.exit_mode }}-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/sd-chrome-before.ppm
            ${{ runner.temp }}/sd-chrome-crop.ppm
            ${{ runner.temp }}/sd-chrome-crop.png
            ${{ runner.temp }}/sd-chrome-mapped-tree.json
            ${{ runner.temp }}/sd-chrome-mask-shift.ppm
            ${{ runner.temp }}/sd-chrome-mask-shift.png
            ${{ runner.temp }}/sd-chrome-mask-shift-tree.json
            ${{ runner.temp }}/sd-chrome-mask-third.ppm
            ${{ runner.temp }}/sd-chrome-mask-third.png
            ${{ runner.temp }}/sd-chrome-mask-third-tree.json
            ${{ runner.temp }}/sd-chrome-abrupt-exit.ppm
            ${{ runner.temp }}/sd-chrome-abrupt-exit.png
            ${{ runner.temp }}/sd-chrome-abrupt-exit-tree.json
            ${{ runner.temp }}/sd-chrome-pending-held.ppm
            ${{ runner.temp }}/sd-chrome-pending-held-tree.json
            ${{ runner.temp }}/sd-chrome-pending-after-kill.ppm
            ${{ runner.temp }}/sd-chrome-pending-after-kill.png
            ${{ runner.temp }}/sd-chrome-pending-after-tree.json
            ${{ runner.temp }}/sd-ci-native-popup-control.log
            ${{ runner.temp }}/sd-ci-native-popup-positive.ppm
            ${{ runner.temp }}/sd-ci-native-popup-positive.png
            ${{ runner.temp }}/sd-ci-native-popup-denied.ppm
            ${{ runner.temp }}/sd-ci-native-popup-denied.png
            ${{ runner.temp }}/sd-chrome-failed-tree.json
      - name: Declare evidence boundary
        if: always()
        run: |
          echo "Real Chrome stays at the same XDG ID/rectangle while isolated SceneFX mask advances 320x240 -> 400x300 -> 280x220, with a screenshot after every step." >> "$GITHUB_STEP_SUMMARY"
          echo "Two isolated CI jobs: the established SIGKILL after PHASE3, and a separately acknowledged but unapplied pending mask request before SIGKILL. Both require native unmap and actual post-kill screenshot clearance." >> "$GITHUB_STEP_SUMMARY"
          echo "If pixel test fails, do not report containment success from scene hit-tests or source clips alone." >> "$GITHUB_STEP_SUMMARY"
          echo "The native-popup-denial matrix job compares a real magenta xdg_popup positive control to the identical native protocol emitted from Chrome's exact disposable service cgroup. This does not mean the Chrome executable itself emitted that popup." >> "$GITHUB_STEP_SUMMARY"
          echo "This uses fixed disposable mask coordinates, NOT a production authenticated Weather host; no browser launch, keyboard/pointer/focus, popups or operator workstation changes are authorized." >> "$GITHUB_STEP_SUMMARY"
