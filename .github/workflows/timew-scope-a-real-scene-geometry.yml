name: SwayPX TimeW Scope A Real Post-Scene Geometry (CI-only)

on:
  pull_request:
    paths:
      - "tests/timew/ci_overlay_real_scene_geometry.py"
      - "tests/timew/ci_assert_real_scene_geometry.py"
      - "tests/timew/test_ci_real_scene_geometry.py"
      - ".github/workflows/timew-scope-a-real-scene-geometry.yml"
      - "MODEL/timew-scope-a-real-scene-geometry-v0.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-geometry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original source and proof-authority isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          native = Path("sway/timew_scope_a_native_txn_observer.c").read_text()
          meson = Path("sway/meson.build").read_text()
          txn = Path("sway/desktop/transaction.c").read_text()
          probe = Path("sway/timew_scope_a_ci_real_xdg.c").read_text()
          assert "timew_scope_a_native_txn_snapshot_read" in native
          assert "'timew_scope_a_native_txn_observer.c'" not in meson
          assert "TIMEW_CI_NATIVE_SCENE_" not in txn
          assert "TIMEW_CI_NATIVE_SCENE_" not in probe
          assert "ci_scene_geometry(" not in probe
          for f in ("sway/input/seat.c", "sway/input/seatop_default.c",
                    "sway/input/cursor.c", "sway/commands/resize.c",
                    "sway/commands/move.c", "sway/ipc-server.c"):
              assert "TIMEW_CI_NATIVE_SCENE_" not in Path(f).read_text()
          for f in ("tests/timew/ci_overlay_real_scene_geometry.py",
                    "tests/timew/ci_assert_real_scene_geometry.py",
                    "tests/timew/test_ci_real_scene_geometry.py"):
              compile(Path(f).read_text(), f, "exec")
          print("TIMEW_CI_NATIVE_SCENE_SOURCE_ISOLATION PASS: production observer dormant, no authorization")
          PY
      - name: Retain corrected per-instruction outcome tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/timew/test_ci_outcome_checker.py
      - name: Adversarial binary64 and scene-context tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/timew/test_ci_real_scene_geometry.py
          echo "TIMEW_CI_NATIVE_SCENE_NEGATIVE PASS: all fake ACK/frame/epoch/C5/move claims denied"

  real-native-current-and-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source at exact PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Nix build environment
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Overlay real XDG, instruction outcomes and dormant geometry reader only in CI
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/timew/ci_inject_real_xdg_lifecycle.py
          python3 -B tests/timew/ci_overlay_observed_lineage.py
          python3 -B tests/timew/ci_overlay_real_instruction_lineage.py
          python3 -B tests/timew/ci_overlay_real_instruction_outcomes.py
          python3 -B tests/timew/ci_overlay_real_scene_geometry.py
          nix build .#swayfx-unwrapped-git --no-link --print-out-paths --show-trace \
            | tee "$RUNNER_TEMP/timew-real-scene-sway.txt"
          compositor="$(tail -n 1 "$RUNNER_TEMP/timew-real-scene-sway.txt")"
          test -x "$compositor/bin/sway"
          test -x "$compositor/bin/swaymsg"
          echo "TIMEW_CI_NATIVE_SCENE_NATIVE_BUILD PASS: real SwayPX, native snapshot observer only linked in CI"
      - name: Pin Mesa and native XDG actor
        shell: bash
        run: |
          set -euo pipefail
          mesa="$(nix eval --raw --impure --expr 'let f = builtins.getFlake (toString ./.); in f.inputs.nixpkgs.legacyPackages.x86_64-linux.mesa.outPath')"
          test -r "$mesa/share/glvnd/egl_vendor.d/50_mesa.json"
          test -d "$mesa/lib/dri"
          test -r "$mesa/lib/libEGL_mesa.so.0"
          foot="$(nix build --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.foot' --no-link --print-out-paths | tail -n 1)"
          test -x "$foot/bin/foot"
          compositor="$(tail -n 1 "$RUNNER_TEMP/timew-real-scene-sway.txt")"
          echo "STAGE_DIRECTOR_MESA_DIR=$mesa" >> "$GITHUB_ENV"
          echo "STAGE_DIRECTOR_TEST_FOOT=$foot/bin/foot" >> "$GITHUB_ENV"
          echo "STAGE_DIRECTOR_TEST_SWAYMSG=$compositor/bin/swaymsg" >> "$GITHUB_ENV"
      - name: Observe real post-arrange current/pending and output in two XDG lifetimes
        shell: bash
        run: |
          set -euo pipefail
          compositor="$(tail -n 1 "$RUNNER_TEMP/timew-real-scene-sway.txt")"
          for mode in normal forced_timeout; do
            TIMEW_CI_REAL_INSTRUCTION_MODE=1 TIMEW_CI_OUTCOME_MODE="$mode" \
              bash tests/stage_director/ci_udmabuf_smoke.sh "$compositor/bin/sway"
          done
          echo "TIMEW_CI_NATIVE_SCENE_RUNTIME PASS: real post-arrange geometry only, protected receipt NONE"
      - name: Declare no settled frame or privileged native capability
        if: always()
        shell: bash
        run: |
          echo "## TimeW Scope A native post-scene observation" >> "$GITHUB_STEP_SUMMARY"
          echo "Native CI-only reader preserves fractional binary64 PENDING/CURRENT and output facts after arrange_root." >> "$GITHUB_STEP_SUMMARY"
          echo "Neither matching CURRENT nor scene arrangement proves ACK, settled final frame, enrolled producer, C5 consent, native MOVE or production Restore." >> "$GITHUB_STEP_SUMMARY"
