name: Stage Director isolated headless SwayPX runtime smoke

on:
  pull_request:
    branches:
      - master
      - stage-director/isolated-full-build-v0-20261026
      - stage-director/headless-runtime-smoke-20261026
    paths:
      - 'sway/**'
      - 'include/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'tests/stage_director/headless_sway_smoke.sh'
      - '.github/workflows/stage-director-headless-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-director-headless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm source-pinned software EGL render branch
        run: |
          set -euo pipefail
          echo "Pinned SceneFX revision 26200c5 includes WLR_RENDERER_FORCE_SOFTWARE"
          echo "The test script selects that SceneFX software EGL branch on this disposable runner."
      - name: Install Nix on isolated runner
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Compile full SwayPX, no deployment
        run: |
          set -euo pipefail
          git rev-parse HEAD
          nix build .#swayfx-unwrapped-git --no-link --print-out-paths --show-trace \
            | tee "$RUNNER_TEMP/swaypx-headless-store-path.txt"
          output="$(tail -n 1 "$RUNNER_TEMP/swaypx-headless-store-path.txt")"
          test -x "$output/bin/sway"
      - name: Resolve Mesa EGL vendor and software drivers from the locked Nixpkgs
        run: |
          set -euo pipefail
          mesa="$(nix eval --raw --impure --expr 'let f = builtins.getFlake (toString ./.); in f.inputs.nixpkgs.legacyPackages.x86_64-linux.mesa.outPath')"
          echo "Pinned Mesa output: $mesa"
          test -f "$mesa/share/glvnd/egl_vendor.d/50_mesa.json"
          test -d "$mesa/lib/dri"
          test -f "$mesa/lib/libEGL_mesa.so.0"
          echo "STAGE_DIRECTOR_MESA_DIR=$mesa" >> "$GITHUB_ENV"
      - name: Launch and stop one headless compositor instance
        run: |
          set -euo pipefail
          output="$(tail -n 1 "$RUNNER_TEMP/swaypx-headless-store-path.txt")"
          bash tests/stage_director/headless_sway_smoke.sh "$output/bin/sway"
      - name: State smoke-test limits
        if: always()
        run: |
          echo "## Stage Director // Headless runtime" >> "$GITHUB_STEP_SUMMARY"
          echo "This runs the built compositor using WLR_BACKENDS=headless on a disposable runner." >> "$GITHUB_STEP_SUMMARY"
          echo "It creates no NEWS/browser viewer and does not establish paint, popup or input containment." >> "$GITHUB_STEP_SUMMARY"
          echo "The operator's live SwayFX and Quickshell are never touched." >> "$GITHUB_STEP_SUMMARY"
