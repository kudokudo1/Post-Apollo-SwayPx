name: Stage Director isolated headless SwayPX runtime smoke

on:
  pull_request:
    branches:
      - master
      - stage-director/isolated-full-build-v0-20261026
    paths:
      - 'sway/**'
      - 'include/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'tests/stage_director/headless_sway_smoke.sh'
      - '.github/workflows/stage-director-headless-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-director-headless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a DRM render node for SceneFX runtime startup
        run: |
          set -euo pipefail
          for device in /dev/dri/renderD*; do
            if [[ -c "$device" && -r "$device" && -w "$device" ]]; then
              echo "DRM render node available: $device"
              exit 0
            fi
          done
          echo "::error title=BLOCKED_NO_DRM_RENDER_NODE::SceneFX 0.5 requires a usable DRM render node to create its GLES2 renderer. The standard GitHub runner has none. The full SwayPX build remains independently verified."
          exit 2
      - name: Install Nix on isolated runner
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Compile full SwayPX, no deployment
        run: |
          set -euo pipefail
          git rev-parse HEAD
          nix build .#swayfx-unwrapped-git --no-link --print-out-paths --show-trace \
            | tee "$RUNNER_TEMP/swaypx-headless-store-path.txt"
          output="$(tail -n 1 "$RUNNER_TEMP/swaypx-headless-store-path.txt")"
          test -x "$output/bin/sway"
      - name: Launch and stop one headless compositor instance
        run: |
          set -euo pipefail
          output="$(tail -n 1 "$RUNNER_TEMP/swaypx-headless-store-path.txt")"
          bash tests/stage_director/headless_sway_smoke.sh "$output/bin/sway"
      - name: State smoke-test limits
        if: always()
        run: |
          echo "## Stage Director // Headless runtime" >> "$GITHUB_STEP_SUMMARY"
          echo "This runs the built compositor using WLR_BACKENDS=headless on a disposable runner." >> "$GITHUB_STEP_SUMMARY"
          echo "It creates no NEWS/browser viewer and does not establish paint, popup or input containment." >> "$GITHUB_STEP_SUMMARY"
          echo "The operator's live SwayFX and Quickshell are never touched." >> "$GITHUB_STEP_SUMMARY"
